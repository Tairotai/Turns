name: shift-bot
on:
  schedule:
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=$(date -u +%H)
          case $H in
            05|06|07|08|09|10) echo "U=Bap" >> $GITHUB_ENV ;;
            11|12|13|14|15|16) echo "U=Darky" >> $GITHUB_ENV ;;
            17|18|19|20|21|22) echo "U=Tairo" >> $GITHUB_ENV ;;
            *) echo "U=Hrant" >> $GITHUB_ENV ;;
          esac
      - run: curl -X POST -H "Content-Type: application/json" -d "{\"content\":\"Current Turn ${{ env.U }}\"}" https://discord.com/api/webhooks/1504734079222812744/2OwArDVSkZLf1_oJRMMs0ILjPuAm7ej3m7_Ryr2P9OLl9OdzNeZ2-WFhCXzQpqRFSaMf
