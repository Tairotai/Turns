name: Turnos_E1_E5_Definitivo
on:
  schedule:
    - cron: '0 5,11,17,23 * * *' # 00:00, 06:00, 12:00, 18:00 Hora Colombia
  workflow_dispatch:

jobs:
  envio_pro:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Script de Turnos
        run: |
          python3 -c "
          import requests
          from datetime import datetime
          import pytz

          # Configurar Zona Horaria Colombia
          tz = pytz.timezone('America/Bogota')
          hora = datetime.now(tz).hour

          # Lógica de Turnos
          if 0 <= hora < 6:
              nombre = 'Bap'
          elif 6 <= hora < 12:
              nombre = 'Darky'
          elif 12 <= hora < 18:
              nombre = 'Tairo'
          else:
              nombre = 'Hrant'

          # Datos del Webhook
          url = 'https://discord.com/api/webhooks/1504734079222812744/2OwArDVSkZLf1_oJRMMs0ILjPuAm7ej3m7_Ryr2P9OLl9OdzNeZ2-WFhCXzQpqRFSaMf'
          payload = {'content': f'Current **E1 - E5** Turn: **{nombre}**'}

          # Enviar
          response = requests.post(url, json=payload)
          if response.status_code == 204:
              print(f'Enviado con éxito: {nombre}')
          else:
              print(f'Error: {response.status_code}')
          "
