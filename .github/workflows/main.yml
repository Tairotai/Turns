name: Turnos_E1_E5
on:
  schedule:
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:

jobs:
  send_turn:
    runs-on: ubuntu-latest
    steps:
      - name: Definir Nombre
        run: |
          export TZ="America/Bogota"
          HORA=$(date +%-H)
          if [ $HORA -lt 6 ]; then
            echo "TURNO_NAME=Bap" >> $GITHUB_ENV
          elif [ $HORA -lt 12 ]; then
            echo "TURNO_NAME=Darky" >> $GITHUB_ENV
          elif [ $HORA -lt 18 ]; then
            echo "TURNO_NAME=Tairo" >> $GITHUB_ENV
          else
            echo "TURNO_NAME=Hrant" >> $GITHUB_ENV
          fi

      - name: Enviar Webhook
        run: |
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"content\":\"Current **E1 - E5** Turn: **${{ env.TURNO_NAME }}**\"}" \
          https://discord.com/api/webhooks/1504734079222812744/2OwArDVSkZLf1_oJRMMs0ILjPuAm7ej3m7_Ryr2P9OLl9OdzNeZ2-WFhCXzQpqRFSaMf
