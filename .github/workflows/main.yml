name: shift-bot
on:
  schedule:
    - cron: '0 5,11,17,23 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H=$(date -u +%H)
          if [ $H -ge 10 ] && [ $H -lt 16 ]; then U="Bap";
          elif [ $H -ge 16 ] && [ $H -lt 22 ]; then U="Darky";
          elif [ $H -ge 22 ] || [ $H -lt 04 ]; then U="Hrant";
          else U="Tairo"; fi
          curl -X POST -H "Content-Type: application/json" -d "{\"content\": \"Current Turn: $U\"}" https://discord.com/api/webhooks/1504734079222812744/2OwArDVSkZLf1_oJRMMs0ILjPuAm7ej3m7_Ryr2P9OLl9OdzNeZ2-WFhCXzQpqRFSaMf
